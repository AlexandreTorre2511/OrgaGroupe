<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organisation Alexandre TORRE</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6f5;--surface:#fff;--ink:#10201d;--muted:#5b6b67;--line:#dbe3e0;--accent:#0f7a68}
@media (prefers-color-scheme: dark){:root{--bg:#0c1413;--surface:#13201e;--ink:#e7f0ee;--muted:#93a6a1;--line:#21312e;--accent:#3cc4ab;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:64px max(20px,env(safe-area-inset-left)) 64px}
h1{font-family:"Sora",system-ui,sans-serif;font-size:clamp(26px,5vw,36px);margin:0 0 8px}
p{color:var(--muted);margin:0 0 32px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card strong{display:block;font-size:18px;margin-bottom:4px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Organisation Alexandre TORRE</h1>
  <p>Documents de travail partagés pour ETHEREA Services et les marques AZUR BTP.</p>
  <a class="card" href="dossier-commercial/">
    <strong>Dossier commercial syndics</strong>
    <span>ETHEREA Services et Dépannage 06 : offres, références, argumentaire, plan d'action et suivi des pistes.</span>
  </a>
</main>
</body>
</html>
